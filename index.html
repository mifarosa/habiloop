<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Habiloop</title>
<meta name="description" content="Aralıklı alışkanlık takibi: kaç günde bir yapacağını seç, günü gelince sana sorsun.">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habiloop">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme-init.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>Habi<span>loop</span></h1>
    <button id="add" class="icon-btn" data-i18n-aria="add" aria-label="Add">+</button>
  </header>

  <main><div id="app"></div></main>

  <nav class="tabbar">
    <button class="tab active" data-view="habits">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.7 5.6L4 15.5M4 20v-4.5h4.5"/></svg>
      <span data-i18n="nav.habits">Habits</span>
    </button>
    <button class="tab" data-view="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span data-i18n="nav.calendar">Calendar</span>
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
      <span data-i18n="nav.settings">Settings</span>
    </button>
  </nav>

  <dialog id="form-dialog">
    <form id="form" method="dialog">
      <h2 id="form-title"></h2>
      <label><span data-i18n="name">Habit</span><input id="f-name" required maxlength="60" data-i18n-ph="namePh"></label>
      <div class="two">
        <label><span data-i18n="every">Every</span><input id="f-every" type="number" inputmode="numeric" min="1" max="365" value="3" required></label>
        <label><span data-i18n="grace">Tolerance</span><input id="f-grace" type="number" inputmode="numeric" min="0" max="30" value="1"></label>
      </div>
      <label><span data-i18n="time">Reminder time</span><input id="f-time" type="time" value="09:00"></label>
      <label id="f-last-wrap"><span data-i18n="last">Last done</span><input id="f-last" type="date"><small data-i18n="lastHint"></small></label>
      <div id="f-history-wrap"><span class="lbl" data-i18n="history"></span><div id="f-history" class="chips"></div></div>
      <div class="actions">
        <button type="button" id="f-delete" class="btn danger" data-i18n="delete">Delete</button>
        <span class="grow"></span>
        <button type="button" class="btn ghost" data-close data-i18n="cancel">Cancel</button>
        <button type="submit" class="btn primary" data-i18n="save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="other-dialog">
    <h2 data-i18n="otherTitle">Which day?</h2>
    <div id="other-list" class="choices"></div>
    <div class="actions"><button type="button" class="btn ghost" data-close data-i18n="cancel">Cancel</button></div>
  </dialog>

  <dialog id="ask-dialog">
    <h2 id="ask-title"></h2>
    <p id="ask-text" class="muted"></p>
    <div class="choices">
      <button type="button" id="ask-done" class="btn primary" data-i18n="done">Done</button>
      <button type="button" id="ask-other" class="btn" data-i18n="other">Another day</button>
      <button type="button" id="ask-later" class="btn ghost" data-i18n="later">Ask later</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="js/i18n.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
