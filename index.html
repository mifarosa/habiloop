<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Habiloop</title>
<meta name="description" content="Loop Habit Tracker compatible habit tracker. Opens Loop backups.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habiloop">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <button id="menuBtn" class="icon-btn" data-i18n-aria="menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      </button>
      <h1>Habiloop</h1>
      <button id="addBtn" class="icon-btn" data-i18n-aria="addHabit" aria-label="Add habit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <div id="winNav" class="winnav">
      <button id="prevWin" class="icon-btn sm" data-i18n-aria="earlier" aria-label="Earlier">‹</button>
      <span id="winLabel"></span>
      <button id="nextWin" class="icon-btn sm" data-i18n-aria="later" aria-label="Later">›</button>
    </div>
    <div id="dayHead" class="dayhead"></div>
    <ul id="list" class="list"></ul>
    <div id="empty" class="empty" hidden>
      <p data-i18n="emptyTitle">No habits yet</p>
      <p class="muted" data-i18n="emptyText"></p>
      <button id="emptyAdd" class="btn primary" data-i18n="addHabit">Add habit</button>
    </div>
    <a class="coffee" href="https://buymeacoffee.com/mifarosa" target="_blank" rel="noopener noreferrer" data-i18n="coffeeShort">Buy me a coffee</a>
  </div>

  <div id="menu" class="sheet" hidden>
    <div class="sheet-card">
      <button id="importBtn" class="row" data-i18n="importBtn">Import</button>
      <input id="importFile" type="file" hidden>
      <button id="exportBtn" class="row" data-i18n="exportBtn">Export</button>
      <button id="archBtn" class="row" data-i18n="showArchived">Show archived</button>
      <button id="langBtn" class="row"></button>
      <a class="row" href="https://buymeacoffee.com/mifarosa" target="_blank" rel="noopener noreferrer" data-i18n="coffee">Buy me a coffee</a>
      <p class="muted small" data-i18n="about"></p>
      <button class="row close" data-close data-i18n="close">Close</button>
    </div>
  </div>

  <div id="detail" class="sheet" hidden>
    <div class="sheet-card">
      <h2 id="dName"></h2>
      <p id="dQuestion" class="muted"></p>
      <canvas id="chart" height="160"></canvas>
      <p class="muted small" id="chartTitle"></p>
      <div id="stats" class="stats"></div>
      <div class="winnav">
        <button id="prevMon" class="icon-btn sm" aria-label="Previous month">‹</button>
        <span id="monLabel"></span>
        <button id="nextMon" class="icon-btn sm" aria-label="Next month">›</button>
      </div>
      <div id="cal" class="cal"></div>
      <div class="actions">
        <button id="dArch" class="btn"></button>
        <span class="grow"></span>
        <button id="dEdit" class="btn" data-i18n="editHabit">Edit</button>
        <button class="btn" data-close data-i18n="close">Close</button>
      </div>
    </div>
  </div>

  <div id="editor" class="sheet" hidden>
    <form id="form" class="sheet-card" autocomplete="off">
      <h2 id="editorTitle"></h2>
      <label><span data-i18n="fName">Name</span><input id="fName" required maxlength="60" data-i18n-ph="phName"></label>
      <label><span data-i18n="fQuestion">Question</span><input id="fQuestion" maxlength="120" data-i18n-ph="phQuestion"></label>
      <label><span data-i18n="fType">Type</span>
        <select id="fType"><option value="0" data-i18n="tYesNo">Yes / No</option><option value="1" data-i18n="tNum">Number</option></select></label>
      <div class="two">
        <label><span data-i18n="fFreq">Frequency</span><input id="fNum" type="number" min="1" max="99" value="1"></label>
        <label><span data-i18n="fTimes">times per</span><input id="fDen" type="number" min="1" max="99" value="1"></label>
        <label><span data-i18n="fDays">days</span></label>
      </div>
      <div id="numFields" class="two" hidden>
        <label><span data-i18n="fTarget">Target</span>
          <select id="fTargetType"><option value="0" data-i18n="atLeast">At least</option><option value="1" data-i18n="atMost">At most</option></select></label>
        <label><span>&nbsp;</span><input id="fTarget" type="number" min="0" step="any" value="1"></label>
        <label><span data-i18n="fUnit">Unit</span><input id="fUnit" maxlength="20" data-i18n-ph="phUnit"></label>
      </div>
      <div><span class="lbl" data-i18n="fColor">Color</span><div id="colors" class="colors"></div></div>
      <div class="actions">
        <button type="button" id="delBtn" class="btn danger" data-i18n="delete">Delete</button>
        <span class="grow"></span>
        <button type="button" class="btn" data-close data-i18n="cancel">Cancel</button>
        <button type="submit" class="btn primary" data-i18n="save">Save</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="lib/sql-wasm.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/score.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
