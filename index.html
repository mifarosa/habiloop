<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self'; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://*.firebaseapp.com https://*.firebaseio.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Habiloop</title>
<meta name="description" content="Aralıklı alışkanlık takibi: kaç günde bir yapacağını seç, günü gelince sana sorsun.">
<meta name="theme-color" content="#f5efe3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habiloop">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script src="js/theme-init.js"></script>
</head>
<body>
  <header class="head">
    <div>
      <div class="mark">habiloop</div>
      <h1 id="title"></h1>
    </div>
    <button id="add" class="new" data-i18n="new">New</button>
  </header>

  <main><div id="app"></div></main>

  <nav class="dock" aria-label="Menu">
    <button class="tab active" data-view="habits" data-i18n="nav.habits">Today</button>
    <button class="tab" data-view="calendar" data-i18n="nav.calendar">Calendar</button>
    <button class="tab" data-view="settings" data-i18n="nav.settings">Settings</button>
  </nav>

  <dialog id="detail-dialog"><div id="detail"></div></dialog>

  <dialog id="form-dialog">
    <form id="form" method="dialog">
      <h2 id="form-title"></h2>
      <label><span data-i18n="name">Habit</span><input id="f-name" required maxlength="60" data-i18n-ph="namePh"></label>
      <div class="two">
        <label><span data-i18n="every">Every</span><input id="f-every" type="number" inputmode="numeric" min="1" max="365" value="3" required></label>
        <label><span data-i18n="grace">Tolerance</span><input id="f-grace" type="number" inputmode="numeric" min="0" max="30" value="1"></label>
      </div>
      <p class="hint" id="f-hint"></p>
      <label><span data-i18n="time">Reminder time</span><input id="f-time" type="time" value="09:00"></label>
      <label id="f-last-wrap"><span data-i18n="last">Last done</span><input id="f-last" type="date"><small data-i18n="lastHint"></small></label>
      <div id="f-history-wrap"><span class="lbl" data-i18n="history"></span><div id="f-history" class="chips"></div></div>
      <div class="actions">
        <span class="grow"></span>
        <button type="button" class="btn quiet" data-close data-i18n="cancel">Cancel</button>
        <button type="submit" class="btn solid" data-i18n="save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="other-dialog">
    <h2 data-i18n="otherTitle">Which day?</h2>
    <div id="other-list" class="choices"></div>
    <div class="actions"><span class="grow"></span><button type="button" class="btn quiet" data-close data-i18n="cancel">Cancel</button></div>
  </dialog>

  <dialog id="ask-dialog">
    <p class="lbl" data-i18n="askLabel">It's time</p>
    <h2 id="ask-title"></h2>
    <p id="ask-text" class="muted"></p>
    <div class="choices">
      <button type="button" id="ask-done" class="btn solid" data-i18n="done">Done</button>
      <button type="button" id="ask-other" class="btn" data-i18n="other">Another day</button>
      <button type="button" id="ask-later" class="btn quiet" data-i18n="later">Ask later</button>
    </div>
  </dialog>

  <dialog id="confirm-dialog">
    <h2 id="confirm-text"></h2>
    <div class="actions"><span class="grow"></span>
      <button type="button" id="confirm-no" class="btn quiet" data-i18n="cancel">Cancel</button>
      <button type="button" id="confirm-yes" class="btn solid danger-solid" data-i18n="delete">Delete</button></div>
  </dialog>

  <dialog id="pw-dialog">
    <form id="pw-form">
      <h2 id="pw-title"></h2>
      <p id="pw-text" class="muted"></p>
      <label><span data-i18n="pw.label">Password</span><input id="pw-1" type="password" autocomplete="off"></label>
      <label id="pw-2-wrap"><span data-i18n="pw.confirm">Password (again)</span><input id="pw-2" type="password" autocomplete="off"></label>
      <p id="pw-err" class="hint err"></p>
      <div class="actions">
        <button type="button" id="pw-forgot" class="linkbtn danger" data-i18n="pw.forgot">Forgot password</button>
        <span class="grow"></span>
        <button type="button" id="pw-cancel" class="btn quiet" data-i18n="cancel">Cancel</button>
        <button type="submit" id="pw-ok" class="btn solid" data-i18n="pw.ok">Continue</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="js/firebase-config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
